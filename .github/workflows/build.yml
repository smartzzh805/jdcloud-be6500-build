name: Build firmware-matched OAF packages (6b5baeb)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h .

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libncursesw5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone source at firmware commit 6b5baeb
        run: |
          git clone --filter=blob:none https://github.com/VIKINGYFY/immortalwrt.git source
          cd source
          git checkout 6b5baeb9a033192796ef074e78cf05653bf5b43f
          echo ==== HEAD ====
          git rev-parse HEAD
          echo ==== libubox upstream commit (expect a396f38a) ====
          grep PKG_SOURCE_VERSION package/libs/libubox/Makefile

      - name: Install feeds
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        working-directory: source
        run: |
          cp ../config.seed .config
          make defconfig
          echo ==== target ====
          grep -iE 'jdcloud|qualcommbe' .config | head
          echo ==== OAF modules (expect =m) ====
          grep -iE 'PACKAGE.*(appfilter|oaf)' .config | head -30
          grep -q 'DEVICE_jdcloud_re-cs-06=y' .config || { echo ERR_device_not_selected; exit 1; }
          grep -q 'CONFIG_PACKAGE_appfilter=m' .config || { echo ERR_appfilter_not_m; exit 1; }
          grep -q 'CONFIG_PACKAGE_luci-app-appfilter=m' .config || { echo ERR_luci_not_m; exit 1; }

      - name: Download sources
        working-directory: source
        run: make download -j8

      - name: Build
        working-directory: source
        run: make -j2

      - name: Collect OAF packages
        run: |
          mkdir -p artifacts
          echo ==== package dirs ====
          find source/bin -maxdepth 4 -type d | head -40
          find source/bin -type f \( -iname '*appfilter*.apk' -o -iname '*oaf*.apk' -o -iname '*appfilter*.ipk' -o -iname '*oaf*.ipk' \) -exec cp -v {} artifacts/ \;
          echo ==== collected ====
          ls -lh artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: oaf-matched-6b5baeb-${{ github.run_number }}
          name: Firmware-matched OAF @ 6b5baeb - run ${{ github.run_number }}
          body: |
            Compiled from VIKINGYFY/immortalwrt commit 6b5baeb = the exact source of firmware r0-6b5baeb.
            Library ABI matches your firmware: libubox20261103 / libubus20261028 (upstream a396f38a / db20eff5).
            User-mode packages (kernel-fingerprint independent):
            - appfilter : backend service + rule DB
            - luci-app-appfilter : LuCI web UI
            - luci-i18n-appfilter-zh-cn : Chinese UI
            - kmod-oaf : kernel module (optional, you already have oaf.ko loaded)
            You only need appfilter + luci packages since your oaf.ko is already loaded.
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
