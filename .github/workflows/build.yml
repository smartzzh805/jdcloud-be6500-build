name: Build ImmortalWrt for JDCloud BE6500

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Clone upstream source
        run: git clone --depth 1 -b owrt https://github.com/VIKINGYFY/immortalwrt.git source

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h .

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libncursesw5-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Install feeds
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        working-directory: source
        run: |
          cp ../config.seed .config
          make defconfig
          echo "---- selected target / device ----"
          grep -iE 'jdcloud|re.cs.06|qualcommbe' .config | head -40
          echo "---- package selection report ----"
          missing=0
          while read -r sym; do
            [ -z "$sym" ] && continue
            if grep -qx "$sym=y" .config; then
              echo "  OK      $sym"
            else
              echo "  MISSING $sym"
              missing=$((missing+1))
            fi
          done < <(grep '^CONFIG_PACKAGE_' ../config.seed)
          echo "---- missing package count: $missing ----"
          echo "---- sanity: abort if device or core packages missing ----"
          grep -q 'DEVICE_jdcloud_re-cs-06=y' .config || { echo "ERROR: device not selected"; exit 1; }
          grep -q 'CONFIG_PACKAGE_luci-app-appfilter=y' .config || { echo "ERROR: OAF not selected"; exit 1; }
          [ "$missing" -eq 0 ] || { echo "ERROR: $missing requested packages were not selected (see MISSING lines)"; exit 1; }

      - name: Download sources
        working-directory: source
        run: make download -j8

      - name: Build firmware
        working-directory: source
        run: make -j2 V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find source/bin/targets/qualcommbe/ipq53xx -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*sha256*' \) \
            -exec cp -v {} artifacts/ \;
          ls -lh artifacts
          df -h .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: be6500-heavy-${{ github.run_number }}
          name: JDCloud BE6500 (RE-CS-06) heavy build ${{ github.run_number }}
          body: |
            ImmortalWrt owrt / qualcommbe / ipq53xx / jdcloud_re-cs-06
            Based on latest source (incl. firewall4 fix). Heavy package set:
            - OpenAppFilter (OAF) parental control
            - AdGuard Home / SmartDNS
            - PassWall
            - SQM / PBR / UPnP / nlbwmon / vnstat2
            - qBittorrent / Aria2 / Samba4 / hd-idle / diskman
            - ttyd / filebrowser / WoL / statistics / attendedsysupgrade
            Built by GitHub Actions, run ${{ github.run_number }}.

            WARNING: third-party U-Boot (p14/p15, clear p3/p4 BOOTCONFIG) is required
            before flashing factory.bin. Never overwrite p17 ART or p25 factory.
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
