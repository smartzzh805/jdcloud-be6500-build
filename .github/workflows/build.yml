name: Build firmware-matched OAF packages (6b5baeb)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h .

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libncursesw5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Fetch source tree at firmware commit 6b5baeb
        run: |
          cat > /tmp/fetch.sh <<'SH'
          set -x
          SHA=6b5baeb9a033192796ef074e78cf05653bf5b43f
          URL="https://codeload.github.com/VIKINGYFY/immortalwrt/tar.gz/${SHA}"
          echo "downloading $URL"
          curl -fL --retry 5 --retry-delay 5 -o src.tar.gz "$URL" || { echo FAIL_curl; exit 11; }
          ls -lh src.tar.gz
          SIZE=$(stat -c%s src.tar.gz)
          echo "tarball size = $SIZE bytes"
          MAGIC=$(head -c 2 src.tar.gz | od -An -tx1 | tr -d ' \n')
          echo "magic = $MAGIC"
          mkdir -p source
          tar -xzf src.tar.gz -C source --strip-components=1 || { echo FAIL_tar; exit 13; }
          rm -f src.tar.gz
          echo ==== tree root ====
          ls source | head -30
          du -sh source
          echo ==== libubox ====
          grep PKG_SOURCE_VERSION source/package/libs/libubox/Makefile || echo WARN_libubox_grep
          echo ==== ubus ====
          grep PKG_SOURCE_VERSION source/package/system/ubus/Makefile || echo WARN_ubus_grep
          SH
          bash /tmp/fetch.sh > fetch.log 2>&1
          RC=$?
          echo "$RC" > fetch.rc
          tail -n 60 fetch.log
          echo "fetch rc=$RC"
          exit $RC

      - name: Install feeds (only what OAF needs)
        working-directory: source
        run: |
          printf 'src-git packages https://github.com/immortalwrt/packages.git\nsrc-git luci https://github.com/immortalwrt/luci.git\n' > feeds.conf.default
          ( ./scripts/feeds update -a && ./scripts/feeds install luci luci-app-appfilter luci-i18n-appfilter-zh-cn appfilter ) > ../feeds.log 2>&1
          RC=$?
          tail -n 40 ../feeds.log
          echo "feeds rc=$RC"
          echo "$RC" > ../feeds.rc
          [ "$RC" = "0" ] || { echo ERR_feeds; exit $RC; }
          echo ==== installed feed dirs ====
          ls package/feeds/packages | head
          echo ==== appfilter source ====
          ls -l package/feeds/packages/open-app-filter 2>/dev/null || echo ERR_no_openappfilter
          ls -l package/feeds/luci/luci-app-appfilter 2>/dev/null || echo ERR_no_luci_appfilter
          ls -d package/feeds/luci/luci-i18n-appfilter-zh-cn 2>/dev/null || echo ERR_no_i18n

      - name: Generate .config
        working-directory: source
        run: |
          {
            set -x
            set +e
            cp ../config.seed .config
            sed -i 's/\r$//' .config
            make defconfig > ../defconfig.log 2>&1
            RC=$?
            echo "defconfig rc=$RC"
            echo "$RC" > ../defconfig.rc
            echo "==== grep target ===="
            grep -iE 'CONFIG_TARGET_(qualcommbe|.*re-cs-06)' .config
            echo "==== grep appfilter/oaf ===="
            grep -iE 'appfilter|oaf' .config
            echo "==== checks ===="
            grep -q 'DEVICE_jdcloud_re-cs-06=y' .config; echo "chk_device=$?"
            grep -q 'CONFIG_PACKAGE_appfilter=m' .config; echo "chk_appfilter=$?"
            grep -q 'CONFIG_PACKAGE_luci-app-appfilter=m' .config; echo "chk_luci=$?"
            echo OK_trace_end
          } > ../step7.log 2>&1
          tail -n 60 ../step7.log
          grep -q 'OK_trace_end' ../step7.log && grep -q 'chk_appfilter=0' ../step7.log && grep -q 'chk_luci=0' ../step7.log && grep -q 'chk_device=0' ../step7.log

      - name: Build OAF packages only
        working-directory: source
        run: |
          set -o pipefail
          make -j$(nproc) \
            package/feeds/packages/open-app-filter/compile \
            package/feeds/luci/luci-app-appfilter/compile \
            > ../build.log 2>&1 || { echo "==== BUILD FAILED, tail ===="; tail -n 200 ../build.log; exit 1; }
          echo ==== core build done ====
          tail -n 20 ../build.log
          make -j$(nproc) package/feeds/luci/luci-i18n-appfilter-zh-cn/compile >> ../build.log 2>&1 || echo WARN_i18n_skipped
          echo ==== dependency metadata of built appfilter ====
          find build_dir -path '*appfilter*' -name control -print -exec cat {} \; 2>/dev/null | head -60

      - name: Collect OAF packages
        run: |
          mkdir -p artifacts
          echo ==== bin/packages tree ====
          find source/bin/packages -maxdepth 3 -type d 2>/dev/null | head -30
          find source/bin/packages -type f \( -iname '*appfilter*.apk' -o -iname '*appfilter*.ipk' -o -iname '*oaf*.apk' -o -iname '*oaf*.ipk' \) -exec cp -v {} artifacts/ \;
          echo ==== collected ====
          ls -lh artifacts
          test -n "$(ls -A artifacts)" || { echo ERR_no_artifacts; exit 1; }

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: oaf-matched-6b5baeb-${{ github.run_number }}
          name: Firmware-matched OAF @ 6b5baeb - run ${{ github.run_number }}
          body: |
            Compiled from VIKINGYFY/immortalwrt commit 6b5baeb = the exact source of firmware r0-6b5baeb.
            Library ABI matches your firmware: libubox20261103 / libubus20261028 (upstream a396f38a / db20eff5).
            Packages:
            - appfilter : backend service + rule DB (userspace)
            - luci-app-appfilter : LuCI web UI
            - luci-i18n-appfilter-zh-cn : Chinese UI
            - kmod-oaf : kernel module (same tree, dependency of appfilter)
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump diagnostics into repo
        if: always()
        run: |
          mkdir -p diag
          {
            echo "run=${{ github.run_number }} sha=${{ github.sha }}"
            echo "==== fetch.rc ===="
            cat fetch.rc 2>/dev/null || echo "(none)"
            echo "==== fetch.log (last 60) ===="
            tail -n 60 fetch.log 2>/dev/null || echo "(none)"
            echo "==== feeds.log (last 60) ===="
            tail -n 60 feeds.log 2>/dev/null || echo "(none)"
            echo "==== step7.log (last 100) ===="
            tail -n 100 step7.log 2>/dev/null || echo "(none)"
            echo "==== defconfig.log (last 60) ===="
            tail -n 60 defconfig.log 2>/dev/null || echo "(none)"
            echo "==== build.log (last 150) ===="
            tail -n 150 build.log 2>/dev/null || echo "(none)"
            echo "==== tree ===="
            ls -la
            du -sh source 2>/dev/null || true
          } > diag/last.txt
          git config user.name "ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git add diag/last.txt
          git commit -m "diag run ${{ github.run_number }} [skip ci]" || true
          git push || true
