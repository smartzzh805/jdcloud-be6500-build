name: Build ImmortalWrt firmware for JDCloud BE6500 (OAF)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h .

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libncursesw5-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone source
        run: git clone --depth 1 -b owrt https://github.com/VIKINGYFY/immortalwrt.git source

      - name: Install feeds
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        working-directory: source
        run: |
          cp ../config.seed .config
          make defconfig
          echo "==== HEAD ===="
          git log -1 --format='%h %ci %s'
          echo "==== target / device ===="
          grep -iE 'jdcloud|re.cs.06|qualcommbe' .config | head -40
          echo "==== OAF selection ===="
          grep -iE 'appfilter|kmod-oaf' .config | head -40
          grep -q 'DEVICE_jdcloud_re-cs-06=y' .config || { echo "ERROR: device not selected"; exit 1; }
          grep -q 'CONFIG_PACKAGE_luci-app-appfilter=y' .config || { echo "ERROR: OAF not selected"; exit 1; }
          grep -q 'CONFIG_PACKAGE_kmod-oaf=y' .config || { echo "ERROR: kmod-oaf not selected"; exit 1; }

      - name: Download sources
        working-directory: source
        run: make download -j8

      - name: Build firmware
        working-directory: source
        run: make -j$(nproc) V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find source/bin/targets/qualcommbe/ipq53xx -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*sha256*' \) \
            -exec cp -v {} artifacts/ \;
          echo "==== artifacts ===="
          ls -lh artifacts
          grep -q 'squashfs-factory.bin' <(ls artifacts) || { echo "ERROR: no factory image"; exit 1; }
          grep -q 'squashfs-sysupgrade.bin' <(ls artifacts) || { echo "ERROR: no sysupgrade image"; exit 1; }
          df -h .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: be6500-oaf-fw-${{ github.run_number }}
          name: JDCloud BE6500 (RE-CS-06) firmware + OAF - run ${{ github.run_number }}
          body: |
            Full ImmortalWrt firmware for JDCloud Zhaoyun BE6500 (RE-CS-06, IPQ5322).
            Source: VIKINGYFY/immortalwrt owrt branch, latest commit (see build log HEAD line).
            Target: qualcommbe / ipq53xx / jdcloud_re-cs-06, kernel 6.18.
            Includes OpenAppFilter (OAF) parental control - upstream destan19/OpenAppFilter
            packaged by ImmortalWrt feed (luci-app-appfilter + appfilter + kmod-oaf), Simplified Chinese UI.

            Images:
            - *squashfs-factory.bin : first flash from stock firmware
            - *squashfs-sysupgrade.bin : upgrade from OpenWrt/ImmortalWrt
            - *initramfs-uImage.itb : rescue / test run (does not write flash)
            - sha256sums : verify before flashing

            WARNING: third-party U-Boot (p14/p15, clear p3/p4 BOOTCONFIG) is required
            before flashing factory.bin. Never overwrite p17 ART or p25 factory.
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
